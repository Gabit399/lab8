$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Aruzhan",
      "lastName": "Seitkali",
      "email": "aruzhan.postman@university.kz",
      "major": "Computer Science",
      "enrollmentYear": 2023
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("studentId", pm.response.json().id);
    language: text/javascript
order: 1000
