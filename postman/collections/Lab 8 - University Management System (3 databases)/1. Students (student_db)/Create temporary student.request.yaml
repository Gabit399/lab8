$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Temp",
      "lastName": "Student",
      "email": "temp.postman@university.kz",
      "enrollmentYear": 2024
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("tempStudentId", pm.response.json().id);
    language: text/javascript
order: 5000
