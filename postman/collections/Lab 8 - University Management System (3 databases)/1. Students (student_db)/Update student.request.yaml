$kind: http-request
url: "{{baseUrl}}/api/students/{{studentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Aruzhan",
      "lastName": "Seitkali",
      "email": "aruzhan.postman@university.kz",
      "major": "Software Engineering",
      "enrollmentYear": 2023
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
