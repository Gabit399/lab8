$kind: http-request
url: "{{baseUrl}}/api/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "courseName": "Web Applications in Java Spring",
      "courseCode": "PM301",
      "credits": 5,
      "instructor": "Dr. Akhmetov"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("courseId", pm.response.json().id);
    language: text/javascript
order: 1000
