$kind: http-request
url: "{{baseUrl}}/api/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "courseName": "Database Systems",
      "courseCode": "PM220",
      "credits": 5,
      "instructor": "Dr. Iskakova"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("courseId2", pm.response.json().id);
    language: text/javascript
order: 2000
