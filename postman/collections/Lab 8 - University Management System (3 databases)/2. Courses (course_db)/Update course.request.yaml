$kind: http-request
url: "{{baseUrl}}/api/courses/{{courseId2}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "courseName": "Database Systems",
      "courseCode": "PM220",
      "credits": 6,
      "instructor": "Dr. Iskakova"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
