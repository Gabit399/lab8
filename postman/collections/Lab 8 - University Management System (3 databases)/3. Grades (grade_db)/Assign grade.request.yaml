$kind: http-request
url: "{{baseUrl}}/api/grades"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentId": {{studentId}},
      "courseId": {{courseId}},
      "score": 94
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("gradeId", pm.response.json().id);
    language: text/javascript
order: 1000
