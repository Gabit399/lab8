$kind: http-request
url: "{{baseUrl}}/api/grades"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentId": {{studentId}},
      "courseId": {{courseId2}},
      "score": 78.5
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
