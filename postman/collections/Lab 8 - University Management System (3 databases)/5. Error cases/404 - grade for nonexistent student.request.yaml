$kind: http-request
url: "{{baseUrl}}/api/grades"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentId": 999999,
      "courseId": {{courseId}},
      "score": 50
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 6000
