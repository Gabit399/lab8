$kind: http-request
url: "{{baseUrl}}/api/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "courseName": "Web Applications in Java Spring",
      "courseCode": "PM301",
      "credits": 5,
      "instructor": "Dr. Akhmetov"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000
