$kind: http-request
url: "{{baseUrl}}/api/grades"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentId": {{studentId}},
      "courseId": {{courseId}},
      "score": 60
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 8000
