spring.application.name=lab8
server.port=${SERVER_PORT:8080}

# Credentials come from environment variables; defaults are for local development only.
# See application.properties.example in the project root.
# A local .env file in the project root (not committed) is loaded automatically if it exists,
# so the app also starts from IntelliJ's Run button without extra configuration.
spring.config.import=optional:file:.env[.properties]

# ---------- student_db ----------
app.datasource.student.url=${STUDENT_DB_URL:jdbc:postgresql://localhost:5432/student_db}
app.datasource.student.username=${STUDENT_DB_USERNAME:postgres}
app.datasource.student.password=${STUDENT_DB_PASSWORD:}

# ---------- course_db ----------
app.datasource.course.url=${COURSE_DB_URL:jdbc:postgresql://localhost:5432/course_db}
app.datasource.course.username=${COURSE_DB_USERNAME:postgres}
app.datasource.course.password=${COURSE_DB_PASSWORD:}

# ---------- grade_db ----------
app.datasource.grade.url=${GRADE_DB_URL:jdbc:postgresql://localhost:5432/grade_db}
app.datasource.grade.username=${GRADE_DB_USERNAME:postgres}
app.datasource.grade.password=${GRADE_DB_PASSWORD:}

# Applied to all three entity managers (none | validate | update | create | create-drop)
app.jpa.ddl-auto=${JPA_DDL_AUTO:update}
app.jpa.show-sql=${JPA_SHOW_SQL:false}
