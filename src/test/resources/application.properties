# Three independent in-memory databases in PostgreSQL compatibility mode
app.datasource.student.url=jdbc:h2:mem:student_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
app.datasource.student.username=sa
app.datasource.student.driver-class-name=org.h2.Driver

app.datasource.course.url=jdbc:h2:mem:course_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
app.datasource.course.username=sa
app.datasource.course.driver-class-name=org.h2.Driver

app.datasource.grade.url=jdbc:h2:mem:grade_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
app.datasource.grade.username=sa
app.datasource.grade.driver-class-name=org.h2.Driver

app.jpa.ddl-auto=create-drop
